<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adventure: Science &amp; Antigravity — DevFest Nairobi 2026</title>
  <link rel="icon" href="../../../../favicon.ico">
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    #deck {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      overflow: hidden;
      background: #212121;
    }

    .slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #212121;
      opacity: 0;
      transform: translateX(5%);
      pointer-events: none;
      user-select: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .slide:first-child {
      background: #181614;
    }

    .slide.crop-bottom {
      inset: 0 auto auto -0.74%;
      width: 101.48%;
      height: 101.48%;
      object-fit: cover;
      object-position: center top;
      background: #0d121b;
    }

    .slide.past {
      transform: translateX(-5%);
    }

    .slide.active {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }
  </style>
</head>

<body>
  <main id="deck">
    <img class="slide active" src="slide-01.gif" alt="Adventure: Science &amp; Antigravity (Field Notes)">
    <img class="slide" src="slide-02.jpg" alt="2 Roles of AI in Product Building">
    <img class="slide" src="slide-03.jpg" alt="Experimenting Complex Tasks">
    <img class="slide" src="slide-04.gif" alt="Quest: Building Large AI Systems">
    <img class="slide" src="slide-05.jpg" alt="Best-of-N Execution: Choosing the Best Demo">
    <img class="slide" src="slide-06.jpg" alt="Delegation vs. Micromanagement">
    <img class="slide" src="slide-07.jpg" alt="Specify What Matters">
    <img class="slide" src="slide-08.jpg" alt="Verifying Large Codebases">
    <img class="slide" src="slide-09.jpg" alt="Analyzing Code Flow">
    <img class="slide" src="slide-10.gif" alt="In Conclusion: Your Toolkit for Complex Problems">
    <img class="slide crop-bottom" src="slide-11.gif" alt="Thank You">
  </main>

  <script>
    const slides = document.querySelectorAll('.slide');
    let index = 0;
    let touchStartX = 0;
    let swipedAt = 0;

    function show(next) {
      index = Math.max(0, Math.min(slides.length - 1, next));
      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === index);
        slide.classList.toggle('past', i < index);
      });
      history.replaceState(null, '', '#' + (index + 1));
    }

    function fromHash() {
      const n = parseInt(location.hash.slice(1), 10);
      if (n >= 1 && n <= slides.length) {
        show(n - 1);
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) {
        e.preventDefault();
        show(index + (e.key === ' ' && e.shiftKey ? -1 : 1));
      } else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) {
        e.preventDefault();
        show(index - 1);
      } else if (e.key === 'Home') {
        e.preventDefault();
        show(0);
      } else if (e.key === 'End') {
        e.preventDefault();
        show(slides.length - 1);
      } else if (e.key === 'f' || e.key === 'F') {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else {
          document.documentElement.requestFullscreen();
        }
      }
    });

    document.addEventListener('click', (e) => {
      if (Date.now() - swipedAt < 400) return;
      show(index + (e.clientX < innerWidth * 0.25 ? -1 : 1));
    });

    document.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
    }, {passive: true});

    document.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 40) {
        swipedAt = Date.now();
        show(index + (dx < 0 ? 1 : -1));
      }
    }, {passive: true});

    window.addEventListener('hashchange', fromHash);
    fromHash();
  </script>
  <script src="../../../../redirect.js"></script>
</body>

</html>
