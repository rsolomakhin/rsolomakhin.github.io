<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4CAF50">
  <title>Bob Bucks - Malicious Payment App Test</title>
  <link rel="icon" href="../../favicon.ico">
  <link rel="stylesheet" type="text/css" href="../style.css">
  <style>
    h1, strong {
      color: #4CAF50;
    }
    button {
      background-color: #4CAF50;
    }
    select {
      margin-top: 5px;
      margin-bottom: 10px;
      padding: 5px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="contents">
    <h1>Bob Bucks Malicious Test</h1>
    <p>This merchant accepts Bob Bucks and tests various malicious / edge-case behaviors. <a href="pr.js">View source</a>.</p>
    <p>This is a demo website. No payment is being charged.</p>
    <p>Price: USD <strong>$0.01</strong></p>
    <div>
      <p>Select malicious payment app behavior to test:</p>
      <select id="appType">
        <option value="delay_open_window">Delay openWindow (5 seconds)</option>
        <option value="resolve_without_open_window">Resolve without openWindow</option>
        <option value="resolve_before_open_window">Resolve before openWindow</option>
        <option value="reject_before_open_window">Reject before openWindow</option>
        <option value="resolve_after_open_window">Resolve after openWindow</option>
        <option value="reject_after_open_window">Reject after openWindow</option>
      </select>
    </div>
    <p><button onclick="onBuyClicked()">Invoke Payment App</button></p>
    <p><button onclick="clearAllMessages()">Clear messages</button></p>
    <pre id="msg"></pre>
  </div>
  <script src="../util.js"></script>
  <script src="pr.js"></script>
  <script src="../../redirect.js"></script>
</body>
</html>
