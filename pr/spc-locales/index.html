<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Payment Confirmation - Locales Demo</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" type="text/css" href="../style.css">
</head>

<body>
  <div id="contents">
    <h1>Secure Payment Confirmation - Locales</h1>
    <p>This is a test website. Nothing is charged.</p>
    <div>
      <p>Locales: <input type="text" id="locales" style="width: 32em; font-family: monospace;"
          value='["en-US", "en-CA", "fr-CA"]' placeholder='["en-US", "en-CA", "fr-CA"]' /></p>
    </div>
    <p><button onclick="createPaymentCredential()">Enroll Credential #1</button></p>
    <p>
      <button onclick="onCanMakePaymentClicked()">canMakePayment()</button>
      <button onclick="onShowClicked()">show()</button>
    </p>
  </div>
  <pre id="msg"></pre>
  <p>Based on the <a
      href="https://github.com/w3c/secure-payment-confirmation">Secure Payment
      Confirmation explainer</a>.</p>
  <script src="../util.js"></script>
  <script src="../spc_util.js"></script>
  <script src="pr.js"></script>
  <script src="/redirect.js"></script>
</body>

</html>
