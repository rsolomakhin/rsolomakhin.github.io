<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPC Capabilities Pop-up (Same-Origin)</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" type="text/css" href="../style.css">
</head>

<body>
  <div id="contents">
    <h1 style="margin-top: 0;">Same-Origin Pop-up</h1>
    <p>Loaded from: <code><script>document.write(window.location.origin)</script></code></p>
    <p>Click below to redirect this pop-up to <code>stephenmcgruer.com</code>:</p>
    <div style="margin: 12px 0;">
      <label for="targetUrl"><strong>Redirect Target URL:</strong></label>
      <input type="text" id="targetUrl" style="box-sizing: border-box; width: 100%; margin-top: 6px; font-size: 14px; padding: 6px;"
        value="https://www.stephenmcgruer.com/web-payments-demos/pr/spc-capabilities-in-3p-popup/redirected.html">
    </div>
    <p><button onclick="redirectTo3P()">Redirect to 3P Domain</button></p>
  </div>
  <pre id="msg"></pre>
  <script src="../util.js"></script>
  <script>
    function redirectTo3P() {
      const targetUrl = document.getElementById('targetUrl').value;
      if (!targetUrl) {
        error('Please enter a target URL.');
        return;
      }
      window.location.href = targetUrl;
    }
  </script>
  <script src="/redirect.js"></script>
</body>

</html>
